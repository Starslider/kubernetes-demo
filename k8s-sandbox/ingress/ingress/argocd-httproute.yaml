apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-backend
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ingress-gateway
      namespace: ingress
  hostnames:
    - "argocd.dhlabs.org"
  rules:
    - filters:
        # ArgoCD defaults to X-Frame-Options: sameorigin which blocks HA iframes.
        # Strip/replace so Muse Chat dashboard can embed the UI.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            remove:
              - "X-Frame-Options"
            set:
              - name: Content-Security-Policy
                value: "frame-ancestors 'self' https://starslider.internet-box.ch http://192.168.1.10:8123 https://*.internet-box.ch"
      backendRefs:
        - kind: Service
          name: argocd-server
          port: 80
          namespace: argocd
