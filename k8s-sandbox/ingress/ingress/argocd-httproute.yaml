apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-backend
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ingress-gateway
      namespace: ingress
  hostnames:
    - "argocd.dhlabs.org"
  rules:
    - filters:
        # Allow embedding in Home Assistant (and any other dashboard).
        # ArgoCD still requires login; this only relaxes clickjacking headers.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            remove:
              - "X-Frame-Options"
            set:
              - name: Content-Security-Policy
                value: "frame-ancestors *"
      backendRefs:
        - kind: Service
          name: argocd-server
          port: 80
          namespace: argocd
