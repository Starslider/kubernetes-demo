apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ollama-operator-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
  sources:
    # Pin operator release. gcr.io/kubebuilder/kube-rbac-proxy:v0.15.0 was
    # removed from GCR (404 / ImagePullBackOff). Rewrite via kustomize images
    # (Argo expects NAME=NEW:TAG strings, not maps).
    - repoURL: https://github.com/nekomeowww/ollama-operator.git
      path: config/default
      targetRevision: v0.10.10
      kustomize:
        images:
          - gcr.io/kubebuilder/kube-rbac-proxy=quay.io/brancz/kube-rbac-proxy:v0.18.1
    - repoURL: https://github.com/Starslider/kubernetes-demo.git
      path: k8s-sandbox/ollama
      targetRevision: HEAD
