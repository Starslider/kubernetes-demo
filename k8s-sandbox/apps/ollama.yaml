apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ollama-operator-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
  sources:
    # Pin operator release. kustomize image rewrite fixes removed
    # gcr.io/kubebuilder/kube-rbac-proxy:v0.15.0 (404 / ImagePullBackOff).
    - repoURL: https://github.com/nekomeowww/ollama-operator.git
      path: config/default
      targetRevision: v0.10.10
      kustomize:
        images:
          - name: gcr.io/kubebuilder/kube-rbac-proxy
            newName: quay.io/brancz/kube-rbac-proxy
            newTag: v0.18.1
    - repoURL: https://github.com/Starslider/kubernetes-demo.git
      path: k8s-sandbox/ollama
      targetRevision: HEAD
