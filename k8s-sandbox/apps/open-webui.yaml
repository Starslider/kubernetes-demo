apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: open-webui
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - repoURL: https://github.com/Starslider/kubernetes-demo.git
      path: k8s-sandbox/open-webui
      targetRevision: HEAD
      ref: values
    - repoURL: https://helm.openwebui.com
      chart: open-webui
      targetRevision: 16.0.0
      helm:
        releaseName: open-webui
        valueFiles:
          - $values/k8s-sandbox/open-webui/values.yaml
