apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.49.0
    chart: loki
    helm:
      valuesObject:
        # Single binary mode with filesystem storage
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          memberlist:
            join_members: []
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            retention_period: 30d
            max_cache_freshness_per_query: 10m
        minio:
          enabled: false
        monitoring:
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false
          serviceMonitor:
            enabled: true
        deploymentMode: SingleBinary
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 10Gi
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        gateway:
          enabled: false
        networkPolicy:
          enabled: false
        chunksCache:
          enabled: true
          allocatedMemory: 512
        resultsCache:
          enabled: true
          allocatedMemory: 512
        # Canary cannot reach Loki from WSL bridge CNI (no cluster DNS/mesh).
        # Keep canary on real Cilium nodes only.
        lokiCanary:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: networking.home/cilium
                        operator: NotIn
                        values:
                          - skip
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

