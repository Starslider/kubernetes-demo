# Open WebUI → llama.cpp Muse Glimmer on gpu-worker-3090 (hostNetwork :8000)
# Chart: https://helm.openwebui.com  (open-webui/open-webui)

fullnameOverride: open-webui
replicaCount: 1

# Do not install chart Ollama; backend is OpenAI-compatible llama-server.
ollama:
  enabled: false

# Empty list so chart does not inject OLLAMA_BASE_URLS to a dead :11434
ollamaUrls: []

pipelines:
  enabled: false

tika:
  enabled: false

websocket:
  enabled: true
  manager: ""
  redis:
    enabled: false

persistence:
  enabled: true
  size: 5Gi
  storageClass: nfs
  accessModes:
    - ReadWriteOnce

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# OpenAI-compatible API (llama.cpp / former vLLM port)
openaiBaseApiUrl: "http://192.168.1.150:8000/v1"
openaiApiKey: "sk-local"

# Avoid env keys the chart already injects (ENABLE_OLLAMA_API caused ComparisonError)
extraEnvVars:
  - name: WEBUI_URL
    value: "https://chat.dhlabs.org"
  - name: ENABLE_SIGNUP
    value: "true"
  - name: ENABLE_OPENAI_API
    value: "true"
  - name: OPENAI_API_BASE_URLS
    value: "http://192.168.1.150:8000/v1"
  - name: OPENAI_API_KEYS
    value: "sk-local"
  - name: DEFAULT_MODELS
    value: "muse-glimmer"
