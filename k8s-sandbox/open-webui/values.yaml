# Open WebUI → vLLM Muse Glimmer on gpu-worker-3090 (hostNetwork :8000)
# Chart: https://helm.openwebui.com  (open-webui/open-webui)

fullnameOverride: open-webui
replicaCount: 1

# Use cluster vLLM (OpenAI-compatible); do not install chart Ollama.
ollama:
  enabled: false

ollamaUrls: []

pipelines:
  enabled: false

tika:
  enabled: false

websocket:
  enabled: true
  manager: ""
  redis:
    enabled: false

persistence:
  enabled: true
  size: 5Gi
  storageClass: nfs
  accessModes:
    - ReadWriteOnce

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# OpenAI-compatible API (vLLM)
openaiBaseApiUrl: "http://192.168.1.150:8000/v1"
openaiApiKey: "sk-local"

extraEnvVars:
  - name: WEBUI_URL
    value: "https://chat.dhlabs.org"
  - name: ENABLE_SIGNUP
    value: "true"
  - name: ENABLE_OPENAI_API
    value: "true"
  - name: OPENAI_API_BASE_URLS
    value: "http://192.168.1.150:8000/v1"
  - name: OPENAI_API_KEYS
    value: "sk-local"
  - name: DEFAULT_MODELS
    value: "muse-glimmer"
  # Disable stale Ollama connection attempts
  - name: ENABLE_OLLAMA_API
    value: "false"
