# Open WebUI → external Ollama on gpu-worker-3090 (hostNetwork).
# Chart: https://helm.openwebui.com  (open-webui/open-webui)

fullnameOverride: open-webui
replicaCount: 1

# Slim image (~1–1.5GB) — enough for chat against external Ollama; full image is 3–4GB+.
image:
  useSlim: true

# Use existing cluster Ollama; do not install chart's bundled Ollama/Pipelines.
ollama:
  enabled: false

ollamaUrls:
  # LAN hostNetwork endpoint (works across nodes; ClusterIP to GPU node is flaky)
  - "http://192.168.1.150:11434"

pipelines:
  enabled: false

tika:
  enabled: false

# Single replica: in-memory websocket manager (no Redis subchart).
websocket:
  enabled: true
  manager: ""
  redis:
    enabled: false

persistence:
  enabled: true
  size: 5Gi
  storageClass: nfs
  accessModes:
    - ReadWriteOnce

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

extraEnvVars:
  - name: WEBUI_URL
    value: "https://chat.dhlabs.org"
  # First account created becomes admin; tighten later if needed.
  - name: ENABLE_SIGNUP
    value: "true"
  - name: DEFAULT_MODELS
    value: "qwen3.6:27b"
