# Muse Glimmer 30B + DFlash on gpu-worker-3090 (RTX 3090 24GB)
#
# WHY NOT vLLM HERE:
# - gpu-worker-3090 is WSL2; vLLM V1 fails with "UVA is not available"
# - BF16 Muse (~60GB) cannot fit 24GB VRAM
# - Working path: llama.cpp GGUF kquant-17gb + DFlash draft
#   OpenAI-compatible API on :8000 for Open WebUI
#
# Caching strategy:
# 1) hostPath model cache /var/lib/vllm/gguf-models (GGUF files persist)
# 2) GPU residency (-ngl 99 / -ngld 99); warmup CronJob keeps process hot
# 3) Init uses curl streaming (low RAM) — NOT python/huggingface_hub
#    (pip+hf hub OOMs on this ~10Gi WSL host under small limits)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-muse-glimmer-config
  namespace: vllm
  labels:
    app: vllm-muse-glimmer
data:
  HF_REPO: "meta-models/Muse-Glimmer-30B-GGUF"
  HF_BASE: "https://huggingface.co/meta-models/Muse-Glimmer-30B-GGUF/resolve/main"
  MODEL_FILE: "muse-glimmer-30B-kquant-17gb.gguf"
  DRAFT_FILE: "dflash-kquant.gguf"
  MMPROJ_FILE: "mmproj-kquant.gguf"
  SERVED_MODEL_NAME: "muse-glimmer"
  # 8k: safe day-0 fit for kquant-17gb + dflash + mmproj on 24GB
  # Raise toward 16k/32k after health checks if VRAM headroom allows
  CONTEXT_SIZE: "8192"
  PORT: "8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-muse-glimmer
  namespace: vllm
  labels:
    app: vllm-muse-glimmer
    app.kubernetes.io/name: muse-glimmer
    app.kubernetes.io/part-of: muse-glimmer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-muse-glimmer
  template:
    metadata:
      labels:
        app: vllm-muse-glimmer
    spec:
      runtimeClassName: nvidia
      hostNetwork: true
      dnsPolicy: Default
      # Downloads can take a long time (~20GB over WAN)
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: gpu-worker-3090
        accelerator: nvidia-rtx-3090
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/gpu
                    operator: In
                    values: ["true"]
                  - key: nvidia.com/gpu.present
                    operator: In
                    values: ["true"]
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: workload
          operator: Equal
          value: gpu
          effect: PreferNoSchedule
      # Stream GGUFs with curl (resume-capable, ~tens of MiB RAM).
      # python+huggingface_hub was OOMKilled at 1.5Gi on this host.
      # Run as root so hostPath /var/lib/vllm/gguf-models is writable.
      initContainers:
        - name: prefetch-gguf
          image: alpine:3.20
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache curl ca-certificates >/dev/null
              cd /models
              download_one() {
                f="$1"
                min_bytes="$2"
                url="${HF_BASE}/${f}"
                if [ -f "$f" ]; then
                  sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
                  if [ "$sz" -ge "$min_bytes" ]; then
                    echo "OK present: $f ($sz bytes)"
                    return 0
                  fi
                  echo "Incomplete $f ($sz < $min_bytes) — re-downloading"
                  rm -f "$f" "${f}.partial"
                fi
                echo "Downloading $f (min $min_bytes bytes) ..."
                # -L follow HF CDN redirects; -C - resume; stream to .partial
                curl -fL --retry 15 --retry-delay 5 --retry-all-errors \
                  -C - \
                  --connect-timeout 30 \
                  --progress-bar \
                  -o "${f}.partial" \
                  "$url"
                mv -f "${f}.partial" "$f"
                sz=$(stat -c%s "$f")
                echo "Done $f ($sz bytes)"
                if [ "$sz" -lt "$min_bytes" ]; then
                  echo "ERROR: $f too small ($sz < $min_bytes)"
                  exit 1
                fi
              }
              # Expected sizes (approx): main ~16.76Gi, draft ~1.6Gi, mmproj ~1.4Gi
              download_one "$MODEL_FILE" 10000000000
              download_one "$DRAFT_FILE" 500000000
              download_one "$MMPROJ_FILE" 500000000
              echo "All GGUF files ready:"
              ls -lh /models
          envFrom:
            - configMapRef:
                name: vllm-muse-glimmer-config
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              nvidia-smi || true
              ls -lh /models
              for f in "$MODEL_FILE" "$DRAFT_FILE" "$MMPROJ_FILE"; do
                if [ ! -s "/models/$f" ]; then
                  echo "ERROR: missing model file /models/$f"
                  exit 1
                fi
              done
              exec /app/llama-server \
                -m "/models/${MODEL_FILE}" \
                --mmproj "/models/${MMPROJ_FILE}" \
                -md "/models/${DRAFT_FILE}" \
                -ngl 99 \
                -ngld 99 \
                -c "${CONTEXT_SIZE}" \
                -np 1 \
                --host 0.0.0.0 \
                --port "${PORT}" \
                -a "${SERVED_MODEL_NAME}" \
                --jinja \
                --flash-attn on \
                --temp 1.0 \
                --top-p 0.95 \
                --top-k 64 \
                --parallel 1 \
                --cont-batching \
                --metrics
          envFrom:
            - configMapRef:
                name: vllm-muse-glimmer-config
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          ports:
            - name: http
              containerPort: 8000
              hostPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              nvidia.com/gpu: "1"
            limits:
              # WSL host ~10Gi system RAM — keep same envelope as former Ollama
              cpu: "6"
              memory: 6Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          hostPath:
            path: /var/lib/vllm/gguf-models
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-muse-glimmer
  namespace: vllm
  labels:
    app: vllm-muse-glimmer
spec:
  type: ClusterIP
  selector:
    app: vllm-muse-glimmer
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: muse-glimmer
  namespace: vllm
  labels:
    app: vllm-muse-glimmer
spec:
  type: ClusterIP
  selector:
    app: vllm-muse-glimmer
  ports:
    - name: http
      port: 8000
      targetPort: http
