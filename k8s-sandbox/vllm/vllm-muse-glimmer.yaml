# Muse Glimmer 30B + DFlash on gpu-worker-3090 (RTX 3090 24GB)
#
# WHY NOT vLLM HERE:
# - gpu-worker-3090 is WSL2; vLLM V1 fails with "UVA is not available"
# - BF16 Muse (~60GB) cannot fit 24GB VRAM
# - Proven working path on 3090: llama.cpp GGUF kquant-17gb + DFlash draft
#   (OpenAI-compatible API still on :8000 for Open WebUI)
#
# Caching strategy:
# 1) hostPath model cache /var/lib/vllm/models (GGUF files persist)
# 2) prompt prefix / slot reuse via llama-server defaults + warmup cron
# 3) weights stay GPU-resident (-ngl 99 / -ngld 99); warmup keeps process hot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-muse-glimmer-config
  namespace: vllm
  labels:
    app: vllm-muse-glimmer
data:
  HF_REPO: "meta-models/Muse-Glimmer-30B-GGUF"
  MODEL_FILE: "muse-glimmer-30B-kquant-17gb.gguf"
  DRAFT_FILE: "dflash-kquant.gguf"
  MMPROJ_FILE: "mmproj-kquant.gguf"
  SERVED_MODEL_NAME: "muse-glimmer"
  # Context: 32k is comfortable on 3090 with kquant-17gb + dflash + mmproj
  CONTEXT_SIZE: "32768"
  PORT: "8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-muse-glimmer
  namespace: vllm
  labels:
    app: vllm-muse-glimmer
    app.kubernetes.io/name: muse-glimmer
    app.kubernetes.io/part-of: muse-glimmer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-muse-glimmer
  template:
    metadata:
      labels:
        app: vllm-muse-glimmer
    spec:
      runtimeClassName: nvidia
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: gpu-worker-3090
        accelerator: nvidia-rtx-3090
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/gpu
                    operator: In
                    values: ["true"]
                  - key: nvidia.com/gpu.present
                    operator: In
                    values: ["true"]
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: workload
          operator: Equal
          value: gpu
          effect: PreferNoSchedule
      # Lightweight download of GGUF files only (streamed to disk; low host RAM)
      initContainers:
        - name: prefetch-gguf
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              pip install -q --no-cache-dir "huggingface_hub>=0.26.0"
              export HF_HOME=/cache/hf
              mkdir -p /models /cache/hf
              cd /models
              need_dl=0
              for f in "$MODEL_FILE" "$DRAFT_FILE" "$MMPROJ_FILE"; do
                if [ ! -s "$f" ]; then need_dl=1; fi
              done
              if [ "$need_dl" = "1" ]; then
                echo "Downloading GGUF files from $HF_REPO ..."
                hf download "$HF_REPO" \
                  "$MODEL_FILE" "$DRAFT_FILE" "$MMPROJ_FILE" \
                  --local-dir /models
              else
                echo "GGUF files already present"
              fi
              ls -lh /models
              du -sh /models
          envFrom:
            - configMapRef:
                name: vllm-muse-glimmer-config
          volumeMounts:
            - name: models
              mountPath: /models
            - name: hf-cache
              mountPath: /cache/hf
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              nvidia-smi || true
              ls -lh /models
              exec /app/llama-server \
                -m "/models/${MODEL_FILE}" \
                --mmproj "/models/${MMPROJ_FILE}" \
                -md "/models/${DRAFT_FILE}" \
                -ngl 99 \
                -ngld 99 \
                -c "${CONTEXT_SIZE}" \
                -np 1 \
                --host 0.0.0.0 \
                --port "${PORT}" \
                -a "${SERVED_MODEL_NAME}" \
                --jinja \
                --flash-attn on \
                --temp 1.0 \
                --top-p 0.95 \
                --top-k 64 \
                --parallel 1 \
                --cont-batching \
                --metrics
          envFrom:
            - configMapRef:
                name: vllm-muse-glimmer-config
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          ports:
            - name: http
              containerPort: 8000
              hostPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              nvidia.com/gpu: "1"
            limits:
              # WSL host ~10Gi system RAM — keep same envelope as former Ollama
              cpu: "6"
              memory: 6Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          hostPath:
            path: /var/lib/vllm/gguf-models
            type: DirectoryOrCreate
        - name: hf-cache
          hostPath:
            path: /var/lib/vllm/hf-cache
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-muse-glimmer
  namespace: vllm
  labels:
    app: vllm-muse-glimmer
spec:
  type: ClusterIP
  selector:
    app: vllm-muse-glimmer
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: muse-glimmer
  namespace: vllm
  labels:
    app: vllm-muse-glimmer
spec:
  type: ClusterIP
  selector:
    app: vllm-muse-glimmer
  ports:
    - name: http
      port: 8000
      targetPort: http
