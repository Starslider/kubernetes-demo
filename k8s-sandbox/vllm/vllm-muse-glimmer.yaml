# vLLM · Muse Glimmer 30B + DFlash on gpu-worker-3090 (RTX 3090 24GB VRAM / ~10Gi host RAM)
#
# Host constraints (WSL GPU node):
# - System RAM ~10Gi — keep pod limit ≤6Gi (same envelope as former Ollama)
# - Do NOT run heavy huggingface downloads in a 4Gi init (OOMKills)
# - Models cached on hostPath /var/lib/vllm/hf-cache (already has BF16 + draft ~69G)
#
# VRAM: BF16 target ~60GB does not fit 24GB. We load with --dtype auto and rely on
# muse-glimmer image; if still OOM, QUANT_FLAGS enables bitsandbytes 4bit path.
#
# Caching:
# 1) hostPath HF cache (persistent)
# 2) --enable-prefix-caching
# 3) warmup CronJob every 10m
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-muse-glimmer-config
  namespace: vllm
  labels:
    app: vllm-muse-glimmer
data:
  # Prefer official Meta weights already on disk; 4bit override if needed via QUANT_FLAGS
  MODEL_ID: "meta-models/Muse-Glimmer-30B"
  DRAFT_ID: "meta-models/Muse-Glimmer-30B-assistant"
  SERVED_MODEL_NAME: "muse-glimmer"
  MAX_MODEL_LEN: "4096"
  MAX_NUM_SEQS: "2"
  MAX_NUM_BATCHED_TOKENS: "2048"
  GPU_MEMORY_UTILIZATION: "0.88"
  # DFlash
  SPECULATIVE_CONFIG: '{"method":"dflash","model":"meta-models/Muse-Glimmer-30B-assistant","num_speculative_tokens":15}'
  # Leave empty for BF16; set to "--quantization bitsandbytes --load-format bitsandbytes" for 4bit
  # and MODEL_ID=unsloth/Muse-Glimmer-30B-unsloth-bnb-4bit
  QUANT_FLAGS: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-muse-glimmer
  namespace: vllm
  labels:
    app: vllm-muse-glimmer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-muse-glimmer
  template:
    metadata:
      labels:
        app: vllm-muse-glimmer
    spec:
      runtimeClassName: nvidia
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: gpu-worker-3090
        accelerator: nvidia-rtx-3090
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/gpu
                    operator: In
                    values: ["true"]
                  - key: nvidia.com/gpu.present
                    operator: In
                    values: ["true"]
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: workload
          operator: Equal
          value: gpu
          effect: PreferNoSchedule
      # Lightweight cache check only — never re-download in init (host RAM too small)
      initContainers:
        - name: check-cache
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              set -e
              CACHE=/root/.cache/huggingface/hub
              echo "Cache tree:"
              ls -la "$CACHE" || true
              if [ ! -d "$CACHE/models--meta-models--Muse-Glimmer-30B" ]; then
                echo "ERROR: target model not in hostPath cache. Pre-seed /var/lib/vllm/hf-cache on the node."
                exit 1
              fi
              if [ ! -d "$CACHE/models--meta-models--Muse-Glimmer-30B-assistant" ]; then
                echo "ERROR: DFlash draft not in cache."
                exit 1
              fi
              echo "Cache OK (target + DFlash draft present)"
              du -sh /root/.cache/huggingface || true
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: vllm
          image: vllm/vllm-openai:muse-glimmer
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Free any leftover GPU contexts
              nvidia-smi || true
              exec vllm serve "${MODEL_ID}" \
                --host 0.0.0.0 \
                --port 8000 \
                --served-model-name "${SERVED_MODEL_NAME}" \
                --tensor-parallel-size 1 \
                --dtype auto \
                ${QUANT_FLAGS} \
                --gpu-memory-utilization "${GPU_MEMORY_UTILIZATION}" \
                --max-model-len "${MAX_MODEL_LEN}" \
                --max-num-seqs "${MAX_NUM_SEQS}" \
                --max-num-batched-tokens "${MAX_NUM_BATCHED_TOKENS}" \
                --enable-prefix-caching \
                --enable-auto-tool-choice \
                --tool-call-parser muse_glimmer \
                --reasoning-parser muse_glimmer \
                --generation-config auto \
                --speculative-config "${SPECULATIVE_CONFIG}" \
                --download-dir /root/.cache/huggingface/hub \
                --enforce-eager
          envFrom:
            - configMapRef:
                name: vllm-muse-glimmer-config
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: HUGGINGFACE_HUB_CACHE
              value: /root/.cache/huggingface/hub
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          ports:
            - name: http
              containerPort: 8000
              hostPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              nvidia.com/gpu: "1"
            limits:
              # Match prior Ollama envelope on this 10Gi WSL host
              cpu: "4"
              memory: 6Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: hf-cache
          hostPath:
            path: /var/lib/vllm/hf-cache
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-muse-glimmer
  namespace: vllm
  labels:
    app: vllm-muse-glimmer
spec:
  type: ClusterIP
  selector:
    app: vllm-muse-glimmer
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: muse-glimmer
  namespace: vllm
  labels:
    app: vllm-muse-glimmer
spec:
  type: ClusterIP
  selector:
    app: vllm-muse-glimmer
  ports:
    - name: http
      port: 8000
      targetPort: http
