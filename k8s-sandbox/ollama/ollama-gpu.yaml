# Standalone Ollama on gpu-worker-3090 (WSL GPU, Cilium-free).
#
# Host: ~10Gi WSL (.wslconfig memory=10GB, swap=2GB) + RTX 3090 (24Gi VRAM).
# - Do NOT use a 9Gi limit — that OOM-kills the whole WSL distro on this host.
# - Safe pod sizing: request 2Gi / limit 6Gi (leave ~4Gi for WSL/kubelet/system).
# - Weights mostly on GPU VRAM; system RAM covers overhead + KV cache.
# - Default model: qwen3.6:27b (~17GB Q4) — fits 3090 VRAM with moderated context.
#
# GPU pattern: runtimeClassName nvidia + nvidia.com/gpu + nodeSelector/affinity.
# Node must keep networking.home/cilium=skip (host bridge CNI + kube-proxy only).
# Node taint workload=gpu:PreferNoSchedule keeps random apps off this host.
# nvidia.com/gpu NoSchedule is also present for device-plugin scheduling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-gpu
  namespace: ollama-operator-system
  labels:
    app: ollama-gpu
    app.kubernetes.io/name: ollama-gpu
    app.kubernetes.io/part-of: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama-gpu
  template:
    metadata:
      labels:
        app: ollama-gpu
        model.ollama.ayaka.io: qwen3-6-27b
    spec:
      runtimeClassName: nvidia
      # Bridge CNI: use host stack for DNS/registry pull and LAN :11434.
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: gpu-worker-3090
        accelerator: nvidia-rtx-3090
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/gpu
                    operator: In
                    values: ["true"]
                  - key: nvidia.com/gpu.present
                    operator: In
                    values: ["true"]
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # Pull once into hostPath; main container serves the same store.
      initContainers:
        - name: pull-model
          image: ollama/ollama:0.32.6
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ollama serve &
              pid=$!
              for i in $(seq 1 90); do
                if ollama list >/dev/null 2>&1; then break; fi
                sleep 1
              done
              # Skip pull if already present (hostPath persists across restarts)
              if ollama list | grep -q 'qwen3.6:27b'; then
                echo "qwen3.6:27b already present"
              else
                echo "Pulling qwen3.6:27b (~17GB)..."
                ollama pull qwen3.6:27b
              fi
              kill "$pid" || true
              wait "$pid" || true
              echo "Pull complete"
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      containers:
        - name: server
          image: ollama/ollama:0.32.6
          args: ["serve"]
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            # Moderated KV cache for ~10Gi WSL (weights stay on GPU)
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
          ports:
            - name: ollama
              containerPort: 11434
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              # NOT 9Gi — WSL only has ~10Gi total; 9Gi OOMs the whole distro
              memory: 6Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /api/tags
              port: ollama
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/tags
              port: ollama
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          hostPath:
            path: /var/lib/ollama-models
            type: DirectoryOrCreate
