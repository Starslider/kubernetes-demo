apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: ollama

# Do NOT include partial Deployment/StatefulSet "patch" manifests here.
# Multi-source ArgoCD + ServerSideApply treats them as full desired objects
# and clears immutable fields (selector/labels) → SyncFailed + RepeatedResourceWarning.
resources:
  - runtimeclass-nvidia.yaml
  - ollama-model.yaml
  - ollama-model-service.yaml
  - model-warmup-cronjob.yaml
