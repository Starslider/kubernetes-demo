apiVersion: batch/v1
kind: CronJob
metadata:
  name: ollama-model-warmup
  namespace: ollama-operator-system
spec:
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
            - name: warmup
              image: curlimages/curl:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  # Prefer hostNetwork LAN endpoint; ClusterIP may not work from other nodes
                  ENDPOINT="http://ollama-models-store.ollama-operator-system:11434"
                  if curl -s -o /dev/null -w "%{http_code}" --max-time 3 \
                    http://192.168.1.150:11434/api/tags | grep -q 200; then
                    ENDPOINT="http://192.168.1.150:11434"
                  elif curl -s -o /dev/null -w "%{http_code}" --max-time 3 \
                    http://ollama-model-qwen3-6-27b.ollama-operator-system:11434/api/tags | grep -q 200; then
                    ENDPOINT="http://ollama-model-qwen3-6-27b.ollama-operator-system:11434"
                  fi
                  curl -s -X POST "${ENDPOINT}/api/generate" \
                    -H "Content-Type: application/json" \
                    -d '{"model":"qwen3.6:27b","prompt":"ping","stream":false,"options":{"num_ctx":2048,"num_predict":8}}' \
                    --max-time 180 > /dev/null && echo "Model warmed up via ${ENDPOINT}"
          restartPolicy: OnFailure
