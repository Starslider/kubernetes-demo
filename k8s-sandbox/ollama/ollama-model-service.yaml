# Stable ClusterIP for GPU Ollama (ollama-gpu Deployment).
# Note: clients on OTHER nodes may not reach this ClusterIP while the GPU node
# uses bridge CNI; use hostNetwork access or port-forward from a LAN path.
apiVersion: v1
kind: Service
metadata:
  name: ollama-model-qwen3-6-27b
  namespace: ollama-operator-system
  labels:
    app: ollama-gpu
    model.ollama.ayaka.io: qwen3-6-27b
spec:
  type: ClusterIP
  selector:
    app: ollama-gpu
  ports:
    - name: ollama
      port: 11434
      targetPort: 11434
      protocol: TCP

