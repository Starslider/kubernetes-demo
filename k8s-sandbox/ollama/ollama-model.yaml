# Operator Model CR is intentionally NOT applied for GPU workloads.
# WSL gpu-worker-3090 cannot mount the shared NFS image store and cannot reach
# the models-store ClusterIP (bridge CNI). See ollama-gpu.yaml instead.
#
# Kept as documentation of the intended Model shape if NFS/CNI is fixed later:
# apiVersion: ollama.ayaka.io/v1
# kind: Model
# metadata:
#   name: qwen3-6-27b
#   namespace: ollama-operator-system
# spec:
#   image: qwen3.6:27b
#   runtimeClassName: nvidia
#   resources:
#     requests: { cpu: "2", memory: 3Gi, nvidia.com/gpu: "1" }
#     limits:   { cpu: "6", memory: 9Gi, nvidia.com/gpu: "1" }
#   podTemplate:
#     spec:
#       nodeSelector: { kubernetes.io/hostname: gpu-worker-3090 }
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-gpu-readme
  namespace: ollama-operator-system
data:
  README: |
    GPU inference: Deployment ollama-gpu (not operator Model CR).
    Endpoint: http://192.168.1.150:11434 (hostNetwork); Service: ollama-model-qwen3-6-27b:11434.
    Default model: qwen3.6:27b on hostPath /var/lib/ollama-models (RTX 3090 24Gi VRAM).
    Host memory: ~12Gi WSL — pod request 3Gi / limit 9Gi; context 8192; keep-alive 30m.
    Node labels: networking.home/cilium=skip, accelerator=nvidia-rtx-3090,
      node.kubernetes.io/gpu=true, nvidia.com/gpu.present=true
    Pattern: runtimeClassName=nvidia + nvidia.com/gpu + nodeSelector/affinity
